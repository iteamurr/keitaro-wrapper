[project]
name = "keitaro-wrapper"
version = "0.1.0"
description = "Local campaign and offer editor for Keitaro"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.14.3,<3", "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.40,<2.1", "asyncpg>=0.30,<1", "alembic>=1.15,<2",
  "httpx>=0.28,<1", "jinja2>=3.1.6,<4", "itsdangerous>=2.2,<3", "pycountry>=24.6",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=1,<2",
  "pytest-httpx>=0.35,<1",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
  "asgi-lifespan>=2.1,<3",
  "playwright>=1.65.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/keitaro_wrapper"]

[tool.ruff]
target-version = "py313"
line-length = 100
cache-dir = ".local/cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
cache_dir = ".local/cache/mypy"

[[tool.mypy.overrides]]
module = ["pycountry.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
cache_dir = ".local/cache/pytest"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: requires isolated PostgreSQL", "api: application HTTP contracts"]
